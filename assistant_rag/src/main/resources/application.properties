# ============================================
# SERVER CONFIGURATION
# ============================================
server.port=8080
server.servlet.context-path=/

# ============================================
# DATABASE (MySQL)
# ============================================
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/moroccan_rag?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# ============================================
# JWT
# ============================================
jwt.secret=${JWT_SECRET:your-256-bit-secret-key-for-jwt-signing}
jwt.expiration=86400000
app.admin.bootstrap-email=${ADMIN_BOOTSTRAP_EMAIL:}
app.admin.bootstrap-password=${ADMIN_BOOTSTRAP_PASSWORD:}
app.admin.bootstrap-name=${ADMIN_BOOTSTRAP_NAME:Administrateur}

# ============================================
# FLASK API
# ============================================
flask.api.url=${FLASK_API_URL:http://localhost:5001}
flask.api.chat-endpoint=/api/chat
flask.api.connect-timeout=5s
flask.api.timeout=120s

# ============================================
# CORS
# ============================================
frontend.url=${FRONTEND_URL:http://localhost:5173}

# ============================================
# LOGGING
# ============================================
logging.level.com.assistant.Rag=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=205MB
server.tomcat.max-swallow-size=205MB
